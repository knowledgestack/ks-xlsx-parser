name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write     # to create the GitHub release
  id-token: write     # for PyPI Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"

      - name: Read version
        id: meta
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        run: python -m build

      # Gate the release on a clean-venv install of the freshly built wheel.
      # Prevents shipping a wheel that drops modules or leaks top-level
      # packages (the v0.2.0 packaging regression).
      - name: Verify wheel
        run: python scripts/verify_wheel.py

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Find hand-written release notes (if any)
        id: notes
        run: |
          # Use docs/launch/RELEASE_NOTES_<tag>.md as the release body when
          # present, otherwise fall back to GitHub's auto-generated notes.
          NOTES="docs/launch/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "Found release notes: $NOTES"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "auto=true" >> "$GITHUB_OUTPUT"
            echo "No hand-written release notes at $NOTES; using auto-generated."
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.auto == 'true' }}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ks-xlsx-parser
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          skip-existing: true
